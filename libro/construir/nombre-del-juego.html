<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nombre del juego — Mi libro de Roblox</title>
<link rel="stylesheet" href="../estilo.css">
</head>
<body data-pagina="construir/nombre-del-juego.html">
<div class="hoja">
  <h2>🏷️ Cambiarle el nombre al juego</h2>
  <ol>
    <li>Arriba, andá a <span class="menu">File</span> → <span class="menu">Game Settings</span>. (En algunas versiones está en <span class="menu">Home</span> → <span class="menu">Game Settings</span>).</li>
    <li>Entrá a <span class="menu">Basic Info</span>.</li>
    <li>En <b>Name</b>, borrá el nombre viejo y escribí el nuevo.</li>
    <li>Apretá <span class="menu">Save</span>.</li>
  </ol>
  <div class="dibujo">
    <svg width="460" height="190" viewBox="0 0 460 190" font-family="Segoe UI, Arial">
      <rect x="10" y="10" width="440" height="170" rx="10" fill="#fff" stroke="#555" stroke-width="2"/>
      <rect x="10" y="10" width="440" height="30" rx="10" fill="#dfe8fb"/><text x="24" y="31" font-size="14" font-weight="700">Game Settings</text>
      <rect x="20" y="52" width="110" height="26" rx="5" fill="#1b5fd6"/><text x="75" y="70" font-size="13" text-anchor="middle" fill="#fff">Basic Info</text>
      <text x="30" y="100" font-size="13" fill="#666">Permissions</text><text x="30" y="122" font-size="13" fill="#666">Places…</text>
      <text x="150" y="70" font-size="13" font-weight="700">Name</text>
      <rect x="150" y="78" width="280" height="28" rx="5" fill="#fff" stroke="#1b5fd6" stroke-width="2"/><text x="160" y="97" font-size="14">Primer juego</text>
      <rect x="350" y="140" width="80" height="28" rx="6" fill="#17a34a"/><text x="390" y="159" font-size="14" text-anchor="middle" fill="#fff">Save</text>
    </svg>
  </div>
  <div class="bien">✅ Nuestro juego se llama <b>"Primer juego"</b>.</div>
</div>
<script src="../nav.js"></script>
</body>
</html>
